name: Supabase database tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deutschmate_flutter
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and sample seed
        run: supabase db reset

      - name: Run database authorization tests
        run: supabase test db
