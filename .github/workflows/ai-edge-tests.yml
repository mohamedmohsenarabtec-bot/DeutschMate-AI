name: AI Edge Function tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the Edge Function and tests
        working-directory: deutschmate_flutter/supabase/functions
        run: deno task check

      - name: Test validation, isolation, quotas, cost settlement and provider failures
        working-directory: deutschmate_flutter/supabase/functions
        run: deno task test
