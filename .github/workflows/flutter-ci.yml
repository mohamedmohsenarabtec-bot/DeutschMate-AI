name: Flutter client CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: deutschmate_flutter
        shell: pwsh
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Build web
        run: flutter build web

      - name: Build Android verification APK
        run: flutter build apk --release
